services:
  fastapi:
    build: ./main_service
    container_name: fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - keycloak
    networks:
      - app-network

    pre_start:
      - command: ["python", "setup_keycloak.py"]
    

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --verbose  --import-realm
    env_file:
      - .env
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import

    ports:
      - "8080:8080"          
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30

  db:
    image: postgres:17-alpine
    container_name: db
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: