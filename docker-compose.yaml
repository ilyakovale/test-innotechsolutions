services:
  # _service:
  #   build:
  #     context: .
  #     dockerfile: ./keycloak_service/Dockerfile
  #   container_name: keycloak_service
  #   networks:
  #     - app-network
  #   env_file:
  #     - .env
  #   depends_on:
  #     keycloak:
  #       condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --http-relative-path=/auth
    env_file:
      - .env
    ports:
      - "8080:8080"          
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30

  db:
    image: postgres:17-alpine
    container_name: db
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: